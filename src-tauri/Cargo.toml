[package]
name = "ad-hyperoptimize"
version = "1.6.4"
description = "AD HyperOptimize — PC Optimization & Deep Diagnostic Suite"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pc_opt_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sha2 = "0.10"
rayon = "1.10"
rand = "0.8"
# Exact pin: 0.3.47 fixes RUSTSEC-2026-0009 and builds with the current
# cookie/tauri versions (the older 0.3.44+ conflict with cookie 0.18.1 no
# longer occurs). Bump deliberately, with a full build, not implicitly.
time = "=0.3.47"

[features]
# Elevated helper process (docs/audit-2026-10/elevation-design.md, phase 2).
# Off by default until the broker serves real requests.
broker = []

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 3
lto = "thin"        # near-identical performance, links in a fraction of the time
codegen-units = 4
strip = true
panic = "abort"
