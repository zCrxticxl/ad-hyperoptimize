name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after verification (false validates without creating a tag or release)
        type: boolean
        default: false

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    # Hosted Windows images disable Defender and exclude their build drives.
    # Use a clean, disposable Windows runner with active Defender instead.
    runs-on: ${{ vars.WINDOWS_RELEASE_RUNNER || 'adho-release' }}
    timeout-minutes: 90
    env:
      WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a commit from main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Only commits reachable from main may be signed.' }

      - name: Verify version and required release credentials
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          . ./scripts/release/Release.Common.ps1
          Assert-SigningIdentity $env:WINDOWS_SIGNING_THUMBPRINT $env:WINDOWS_TIMESTAMP_URL
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD -or !$env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Windows code-signing and updater credentials are required. Unsigned releases are not published.'
          }
          $conf = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { "v$conf" } else { $env:REF_NAME }
          $pkg = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $cargo = ((Select-String -Path 'src-tauri/Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value)
          if ($tag -cne "v$conf" -or $pkg -cne $conf -or $cargo -cne $conf) { throw 'Tag and app versions differ.' }
          "TAG_NAME=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # No cross-branch binary cache and no signing key during dependency/build scripts.
      - name: Install frontend dependencies
        run: npm ci

      - name: Test release gates
        shell: pwsh
        run: ./scripts/release/tests/Release.Tests.ps1

      - name: Build application without installers
        shell: pwsh
        run: |
          npm run tauri -- build --no-bundle --ci -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed.' }

      - name: Import approved signing identity
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/release/Initialize-Signing.ps1

      - name: Sign and verify application before packaging
        shell: pwsh
        run: ./scripts/release/Sign-WindowsBinary.ps1 -Path src-tauri/target/release/ad-hyperoptimize.exe

      - name: Package and sign Windows installers
        shell: pwsh
        run: |
          npm run tauri -- bundle --ci --bundles nsis,msi --config "$env:RUNNER_TEMP/adho-signing.json"
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer packaging failed.' }

      - name: Verify application and installer signatures
        shell: pwsh
        run: ./scripts/release/Test-ReleaseSignatures.ps1

      - name: Scan final application and installers with Defender
        shell: pwsh
        run: ./scripts/release/Test-ReleaseDefender.ps1

      - name: Preserve release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Extract release notes
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG_NAME.Substring(1)
          $notes = [System.Collections.Generic.List[string]]::new()
          $collecting = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^##\s+v?([0-9][^\s]*)') {
              if ($collecting) { break }
              if ($Matches[1] -ceq $version) { $collecting = $true; continue }
            }
            if ($collecting) { $notes.Add($line) }
          }
          $text = ($notes -join "`n").Trim()
          if (!$text) { $text = "AD HyperOptimize $env:TAG_NAME" }
          $delimiter = [guid]::NewGuid().ToString('N')
          "RELEASE_NOTES<<$delimiter`n$text`n$delimiter" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create tag after successful verification (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG_NAME
          $lines = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'git ls-remote failed.' }
          if ($lines.Count) {
            $line = $lines | Where-Object { $_ -like '*^{}' } | Select-Object -First 1
            if (!$line) { $line = $lines[0] }
            if (($line -split '\s+')[0] -cne $env:GITHUB_SHA) { throw 'Existing tag points to another commit. Bump the version.' }
          } else {
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed.' }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Tag push failed.' }
          }

      - name: Stage, verify uploaded digests and publish
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/release/Publish-Release.ps1

      - name: Remove imported signing certificates
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($thumb in ($env:IMPORTED_SIGNING_THUMBPRINTS -split ',' | Where-Object { $_ })) {
            if ($thumb -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Invalid imported certificate identity.' }
            $path = "Cert:\CurrentUser\My\$thumb"
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -DeleteKey -Force }
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'ad-hyperoptimize-signing.pfx'
          if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
